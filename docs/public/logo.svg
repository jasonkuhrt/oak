<?xml version="1.0" encoding="UTF-8"?>
<svg width="514" height="514" viewBox="0 0 514 514" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: dark) {
      .theme-aware {
        filter: invert(1);
      }
    }
    :root.dark .theme-aware {
      filter: invert(1);
    }
  </style>
  <g class="theme-aware">
    <!-- Outer rounded square border (double line effect) -->
    <rect x="10" y="10" width="494" height="494" rx="80" ry="80"
          fill="none" stroke="#333333" stroke-width="20"/>

    <!-- Inner rounded square background -->
    <rect x="50" y="50" width="414" height="414" rx="60" ry="60"
          fill="#333333"/>

    <!-- Oak leaf petals arranged in cross pattern -->
    <!-- Top-left petal -->
    <path fill="#FFFFFF"
          d="M 180 160 Q 140 180, 140 220 Q 140 260, 180 280 L 220 240 Q 200 220, 200 200 Q 200 180, 220 160 Z"/>

    <!-- Top-right petal -->
    <path fill="#FFFFFF"
          d="M 334 160 Q 374 180, 374 220 Q 374 260, 334 280 L 294 240 Q 314 220, 314 200 Q 314 180, 294 160 Z"/>

    <!-- Bottom-left petal -->
    <path fill="#FFFFFF"
          d="M 180 354 Q 140 334, 140 294 Q 140 254, 180 234 L 220 274 Q 200 294, 200 314 Q 200 334, 220 354 Z"/>

    <!-- Bottom-right petal -->
    <path fill="#FFFFFF"
          d="M 334 354 Q 374 334, 374 294 Q 374 254, 334 234 L 294 274 Q 314 294, 314 314 Q 314 334, 294 354 Z"/>
  </g>
</svg>

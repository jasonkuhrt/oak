<?xml version="1.0" encoding="UTF-8"?>
<svg width="514" height="514" viewBox="0 0 514 514" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: dark) {
      .theme-aware {
        filter: invert(1);
      }
    }
    :root.dark .theme-aware {
      filter: invert(1);
    }
  </style>
  <g class="theme-aware">
    <!-- Outer rounded square border (double line effect) -->
    <rect x="10" y="10" width="494" height="494" rx="80" ry="80"
          fill="none" stroke="#333333" stroke-width="20"/>

    <!-- Inner rounded square background -->
    <rect x="50" y="50" width="414" height="414" rx="60" ry="60"
          fill="#333333"/>

    <!-- Simple oak leaf in center -->
    <path fill="#FFFFFF" d="
      M 257 180
      Q 280 190, 290 210
      Q 295 225, 285 235
      Q 290 245, 295 260
      Q 300 280, 290 295
      Q 295 310, 290 325
      L 270 340
      L 257 380
      L 244 340
      L 224 325
      Q 219 310, 224 295
      Q 214 280, 219 260
      Q 224 245, 229 235
      Q 219 225, 224 210
      Q 234 190, 257 180
      Z"/>
  </g>
</svg>
